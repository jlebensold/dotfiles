# tmux configuration (updated for tmux 3.x+)

# Prefix key: C-]
set-option -g prefix C-]
bind C-] last-window
unbind C-b

# Reload config
bind r source-file ~/.tmux.conf \; display "Config reloaded!"

# Split windows
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind %
unbind '"'

# Window navigation
bind ' ' next-window
bind C-' ' next-window

# Pane navigation (vim-style)
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Resize panes
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Terminal and colors - enable true color support
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",*256col*:RGB"
set -ag terminal-overrides ",alacritty:RGB"
set -ag terminal-overrides ",xterm-kitty:RGB"

# Pass through environment for color support
set -ga update-environment "COLORTERM"

# Start windows and panes at 0
set -g base-index 0
setw -g pane-base-index 0

# Renumber windows when one is closed
set -g renumber-windows on

# Increase history
set -g history-limit 10000

# Enable mouse
set -g mouse on

# Reduce escape delay (important for vim/neovim)
set -sg escape-time 10

# Enable xterm-style key sequences for word navigation (Option+Arrow in iTerm2)
set-window-option -g xterm-keys on

# Focus events (for vim autoread)
set -g focus-events on

# Status bar
set -g status-position bottom
set -g status-style bg=colour235,fg=colour248

set -g status-left-length 40
set -g status-left " #[bold]#S#[default] | "

set -g status-right-length 60
set -g status-right " #(whoami)@#H "

# Window status
setw -g window-status-format " #I:#W "
setw -g window-status-current-format " #I:#W "
setw -g window-status-current-style bg=colour166,fg=colour15,bold
setw -g window-status-style fg=colour248

# Pane borders
set -g pane-border-style fg=colour238
set -g pane-active-border-style fg=colour166

# Message style
set -g message-style bg=colour166,fg=colour15

# Window titles
set -g set-titles on
set -g set-titles-string "#S - #W"
setw -g automatic-rename on

# Activity
setw -g monitor-activity on
set -g visual-activity off
